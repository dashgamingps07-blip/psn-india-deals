name: PSN India Deals

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '30 9 * * *'   # 3:00 PM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psn-india-deals
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check PSN deals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_DISCOUNT: '50'
          PAGES: '2'
          MAX_POSTS: '12'
          # For ONE manual test, uncomment the next line, then remove it again.
          TEST_POST: 'true'
        run: python bot.py

      - name: Save deal history
        run: |
          if [ -f seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git diff --cached --quiet || (git commit -m "Update seen PSN deals" && git push)
          fi
